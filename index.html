<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aama-Buba Helper - Community platform for connecting volunteers with elderly care needs">
    <title>Aama-Buba Helper Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="nav-bar container">
            <h1 class="nav-title" id="nav-title-text">Aama-Buba Helper</h1>
            
            <nav class="nav-links" aria-label="Main navigation">
                <a href="#" class="nav-link" data-view="dashboard">Home</a>
                <a href="#" class="nav-link nav-requestor" data-view="task_request" style="display: none;">Tasks</a>
                <a href="#" class="nav-link nav-requestor" data-view="elder_profile" style="display: none;">Elder Profile</a>
                <a href="#" class="nav-link nav-volunteer" data-view="proactive_offer" style="display: none;">Offer Help</a>
            </nav>
            
            <div class="header-actions">
                <button id="lang-toggle" class="btn btn-secondary" type="button" aria-label="Toggle language">Translate to Nepali</button>
                <button id="logout-btn" class="btn btn-primary" type="button" style="display: none;" aria-label="Logout">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="app-content" role="main"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
